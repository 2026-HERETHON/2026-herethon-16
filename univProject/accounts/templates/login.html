<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 페이지</title>
</head>
<body>
    <h1>로그인</h1>
    <form class="user" method="POST">
        {% csrf_token %}
        <div>
            <input type="text" name="username" placeholder="아이디를 입력해주세요">
        </div>
        <div>
            <input type="password" name="password" placeholder="비밀번  호를 입력해주세요"> 
        </div>
        <input type="submit" value="로그인">
    </form>
</body>
</html>
