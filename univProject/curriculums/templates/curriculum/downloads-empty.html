<!-- 내 전공 - 지금 할 수업 -->
<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내 전공 - 담은 자료(빈화면)</title>
    <link rel="stylesheet" href="../../static/css/settings.css">
    <link rel="stylesheet" href="../../static/css/header.css">
    <link rel="stylesheet" href="../../static/css/downloads-empty.css">
    <link rel="stylesheet" href="../../static/css/footer.css">
</head>

<body>
    <div class="app">
        <div class="header">내 전공</div>
    

        <div class="majorCard">
            <div class="textExplain">
                <div class="majorName">콘텐츠·채널 마케팅 전공</div>
                <div class="majorExplain">
                    사람들의 관심과 반응을 살펴보고,
                    <br/>가치를 콘텐츠로 전달하는 분야예요.
                </div>
            </div>

            <div class="majorIcon">
                <img src="../../static/assets/content-marketing-major-illustration.png" alt="콘텐츠 마케팅 일러스트"/>
            </div>
        </div>

        <div class="sessionProgress">
            <div class="progressBar">
                <div class="filledProgress"></div>
            </div>

            <div class="progressText">전체 과정 1 / 12 차시</div>
        </div>

        <div class="filterComponent">
            <div class="component">지금 할 수업</div>

            <div class="component">전공 로드맵</div>
            
            <div class="componentActive">담은 자료</div>
        </div>

        <div class="emptypage">
            <div class="notice">
                <div class="bigText">아직 담은 자료가 없어요.</div>
                <div class="detailText">
                    자료실에서 지금 단계에 필요한
                    <br/>강의와 콘텐츠를 담아보세요.
                </div>
            </div>

            <div class="moveToDownloads">
                <p>자료실 둘러보기 →</p>
            </div>
        </div>


        <footer class="tapBar">
            <div class="footerTapActive">
                <img src="../../static/assets/mymajortap-active.svg" alt="내 전공 선택됨">
                <p class="tapNameActive">내 전공</p>
            </div>
    
            <div class="footerTap">
                <img src="../../static/assets/together-none.svg" alt="함께 선택안됨">
                <p class="tapName">함께</p>
            </div>
    
            <div class="footerTap">
                <img src="../../static/assets/article-none.svg" alt="자료실 선택안됨">
                <p class="tapName">자료실</p>
            </div>
        </footer>
    </div>
</body>
</html>
