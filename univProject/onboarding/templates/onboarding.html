{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>온보딩 페이지</title>
    <link rel="stylesheet" href="{% static 'css/onboarding.css' %}">
</head>

<body>
    <div class="intro">
        <div class="intro-container">
            <img src="{% static 'assets/logo.svg' %}" class="introImg">
        </div>
    </div>

    <div id="mainSection" class="main-bg hide">
        <div class="container">
            <img src="{% static 'assets/logo.svg' %}" class="logo-title">
            <h4 class="sub-title animate-step1">다시 시작하는 당신에게, <br>두 번째 대학을 잇다</h4>
            
            <div class="action-group animate-step2">
                {% if user.is_authenticated %}
                <a href="{% url 'accounts:logout' %}" class="button"><button>로그아웃</button></a>
                {% else %}
                <a href="{% url 'accounts:signUp' %}" class="mint-btn"><button>입학하기</button></a>
                <div class="login">
                    <span>이미 계정이 있으신가요?</span>
                    <a href="{% url 'accounts:login' %}">로그인 하기</a>
                </div>
                {% endif %}
            </div>
        </div>
    </div>

    <script src="{% static 'js/onboarding.js' %}"></script>
</body>

</html>
