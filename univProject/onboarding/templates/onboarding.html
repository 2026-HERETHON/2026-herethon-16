<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>온보딩 페이지</title>
</head>
<body>
    <h2 class="logo-title">잇대</h2>
    <h5 class="sub-title">다시 시작하는 당신에게, 두 번째 대학을 잇다</h5>
    {% if user.is_authenticated %}
    <a href="{% url 'accounts:logout' %}">로그아웃</a>
    {% else %}
    <a href="{% url 'accounts:signUp' %}" class="mint-btn">입학하기</a>
    <a href="{% url 'accounts:login' %}">로그인</a>
    {% endif %}
</body>
</html>
