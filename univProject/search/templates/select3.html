<!-- 선택 3 - 현재 시작 조건 (내가 한 일로 어떤 변화가 생기면 가장 뿌듯할까요?) -->
{% load static %}
<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />

    <title>잇대</title>

    <!-- static 폴더에서 css 파일 불러오기 -->
    <link rel="stylesheet" href="{% static 'css/select.css' %}" />

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=SF+Pro:wght@600&display=swap"
    />

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
    />
  </head>

  <body>
    <div class="page">
      <!-- 상단 -->
      <header class="header">
        <div class="progressTop">
          <span class="material-symbols-outlined backIcon">
            arrow_back_ios_new
          </span>

          <span class="progressText">3 / 3</span>
        </div>

        <div class="progressBar">
          <div class="progressFill100"></div>
        </div>

        <div class="titleArea3">
          <h1 class="title3">
            내가 한 일로
            <span class="highlight"
              >어떤 변화가 생기면<br />
              가장 뿌듯할까요?</span
            >
          </h1>

          <p class="description3">만들고 싶은 결과에 가까운 것을 골라주세요.</p>

          <span class="limitText3">* 1개 선택</span>
        </div>
      </header>

      <!-- 선택지 -->
      <form action="{% url 'confirm' %}" method="post">
        {% csrf_token %}
        <main class="optionList" data-max="1">
          {% for choice in choices %}
          <label class="optionCard">
            <input type="checkbox" name="choice_id" value="{{ choice.id }}" />
            {{ choice.text }}
          </label>
          {% endfor %}
        </main>

        <footer class="bottomArea">
          <!-- select2.html로 이동하는 CTA 버튼 (선택2 화면으로 이동) -->
          <button
            type="submit"
            class="nextButton"
            name="next_url"
            value="{% url 'loading' %}"
          >
            다음으로
          </button>
        </footer>
      </form>
    </div>

    <!-- static 폴더에서 js 파일 불러오기 -->
    <script src="{% static 'js/select.js' %}"></script>
  </body>
</html>
